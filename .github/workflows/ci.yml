name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: test (${{ matrix.os }}, OpenSpec ${{ matrix.openspec }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        # The oldest supported version and the newest release.
        openspec: ["1.13.1", "latest"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install -g @fission-ai/openspec@${{ matrix.openspec }}
      - run: node --test
        env:
          REQUIRE_OPENSPEC: "1"
